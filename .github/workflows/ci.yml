name: CI and dependency security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        id: install
        run: |
          python -m venv --upgrade-deps "$RUNNER_TEMP/partner-backend"
          backend_python="$RUNNER_TEMP/partner-backend/bin/python"
          "$backend_python" -m pip install --index-url https://download.pytorch.org/whl/cpu --no-deps torch
          "$backend_python" -m pip install -r backend/requirements-dev.txt
          "$backend_python" -m pip check
      - name: Run backend tests offline
        env:
          HF_HOME: ${{ runner.temp }}/partner-hf
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: '"$RUNNER_TEMP/partner-backend/bin/python" -m pytest -q -p no:cacheprovider backend/tests'
      - name: Audit installed Python dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -m venv --upgrade-deps "$RUNNER_TEMP/partner-audit"
          audit_python="$RUNNER_TEMP/partner-audit/bin/python"
          "$audit_python" -m pip install pip-audit==2.10.1
          site_packages=$("$RUNNER_TEMP/partner-backend/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          "$audit_python" -m pip_audit --strict --progress-spinner=off --vulnerability-service=osv --path "$site_packages"

  frontend:
    name: Frontend tests, build and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Run Vitest
        run: npm test
      - name: Build React for production
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Audit npm dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
